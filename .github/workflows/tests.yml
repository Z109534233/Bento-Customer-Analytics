name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Generate reproducible synthetic data
        run: python scripts/generate_synthetic_data.py
      - name: Run descriptive demo
        run: python scripts/run_demo.py
      - name: Run statistical extension
        run: python scripts/run_statistical_extension.py
      - name: Run tests
        run: pytest -q
